name: Bug report
description: Record a reproducible ShiftReady defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Include affected users, records, safety, and workarounds.

  - type: textarea
    id: acceptance
    attributes:
      label: Fix acceptance criteria
    validations:
      required: true
